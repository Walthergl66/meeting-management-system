name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:

# Cancela ejecuciones anteriores del mismo ref: no tiene sentido pagar dos
# builds del mismo commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION_FILE: '.nvmrc'
  PNPM_VERSION: 10.34.5

jobs:
  backend:
    name: Backend (lint, tipos, unit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Generar el cliente de Prisma
        # No hay postinstall: el cliente se genera siempre a mano, también en CI.
        run: pnpm exec prisma generate

      - name: Lint
        run: pnpm lint

      - name: Tipos
        run: pnpm typecheck

      # test:cov y no test: para que el umbral de cobertura sea un gate real.
      - name: Tests unitarios con cobertura
        run: pnpm test:cov

      - name: Build
        run: pnpm build

  frontend:
    name: Frontend (lint, tipos, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Tipos
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

  integration:
    name: Backend e2e (Postgres real)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: meetflow
          POSTGRES_PASSWORD: meetflow
          # Base propia: los e2e crean datos y no deben tocar meetflow.
          POSTGRES_DB: meetflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meetflow -d meetflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://meetflow:meetflow@localhost:5432/meetflow_test?schema=public
      # También como TEST_DATABASE_URL: así el teardown vacía la base al
      # terminar. Sin ella los e2e correrían, pero nadie limpiaría.
      TEST_DATABASE_URL: postgresql://meetflow:meetflow@localhost:5432/meetflow_test?schema=public
      JWT_SECRET: ci-jwt-secret-value-at-least-32-chars
      CORS_ORIGINS: http://localhost:3001
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Generar el cliente de Prisma
        run: pnpm exec prisma generate

      - name: Aplicar migraciones
        # prisma migrate deploy, no dev: en CI no se generan migraciones.
        run: pnpm exec prisma migrate deploy

      - name: Tests e2e
        run: pnpm test:e2e

  docker:
    name: Dockerfiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          target: runner
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          target: runner
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build backend (etapa build, la que ejecuta migrate)
        # El servicio migrate del compose construye `target: build`, no `runner`.
        # Construir solo runner dejaba esa etapa sin verificar: podía romperse
        # (por ejemplo con el cambio de la ruta del cliente Prisma) y el CI
        # seguía en verde mientras el deploy fallaba, porque api depende de
        # migrate con service_completed_successfully.
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          target: build
          push: false
          cache-from: type=gha,scope=backend-build
          cache-to: type=gha,mode=max,scope=backend-build

      - name: Valida docker-compose.yml
        # Valida el esquema y la interpolación sin levantar nada. Necesita las
        # variables que exige el compose aunque el resultado se descarte.
        env:
          JWT_SECRET: ci-jwt-secret-value-at-least-32-chars
        run: docker compose config --quiet

      - name: Comprueba que migrate usa la ruta real del paquete
        # El servicio migrate fallaba con /app/backend en lugar de
        # /repo/backend, y eso rompía api por depends_on. Regresión barata.
        run: |
          grep -q 'pnpm --dir /repo/backend exec prisma migrate deploy' docker-compose.yml \
            || { echo "docker-compose.yml: la ruta del servicio migrate no es /repo/backend"; exit 1; }
          grep -q '^WORKDIR /repo/backend' backend/Dockerfile \
            || { echo "backend/Dockerfile: WORKDIR no es /repo/backend"; exit 1; }

  stack:
    name: Stack completo (compose up)
    runs-on: ubuntu-latest
    env:
      # El compose lo exige desde que dejó de tener valor por defecto.
      JWT_SECRET: ci-jwt-secret-value-at-least-32-chars
    steps:
      - uses: actions/checkout@v4

      # Hasta ahora el job docker solo construía imágenes: ningún contenedor se
      # había levantado nunca en CI, así que los healthchecks, el USER node con
      # el volumen de uploads, la ruta del cliente Prisma y el arranque real no
      # los comprobaba ninguna gate. Una rotten de entorno (TRUST_PROXY vacío,
      # JWT_SECRET ausente) pasaba el build en verde y dejaba el stack entero
      # en crashloop.
      - name: Levanta el stack y espera a los healthchecks
        run: |
          set -euo pipefail
          echo "compose: $(docker compose version --short 2>/dev/null || echo desconocido)"
          echo "docker:  $(docker version -f '{{.Server.Version}}')"
          df -h / /var/lib/docker | cat

          # Las tres imágenes se construyen en serie: en paralelo, un runner con
          # 7 GB se queda sin memoria con tres pnpm install y un next build a la
          # vez, y el job moría en menos de dos minutos sin llegar a levantar
          # nada. El job docker, que construye de una en una, sí pasaba.
          export COMPOSE_PARALLEL_LIMIT=1
          # Sin este if, `set -e` abortaba en cuanto up devolvía error y los
          # logs de la api se perdían: el motivo del unhealthy quedaba fuera
          # del registro.
          if ! docker compose up -d --build --remove-orphans; then
            echo "::error::docker compose up devolvió error"
            docker compose ps -a --format '{{.Name}}	{{.Status}}'
            for servicio in migrate api web; do
              echo "===== logs de $servicio ====="
              docker compose logs --tail=80 "$servicio" || true
            done
            exit 1
          fi

          # migrate es de un solo uso y api depende de él con
          # service_completed_successfully: si no sale con 0, api no arranca.
          migrate_id=""
          for _ in $(seq 1 120); do
            migrate_id=$(docker compose ps -aq migrate)
            if [ -n "$migrate_id" ]; then break; fi
            sleep 2
          done
          if [ -z "$migrate_id" ]; then
            echo "::error::migrate no llegó a crearse"
            docker compose logs --tail=100
            exit 1
          fi
          for _ in $(seq 1 120); do
            codigo=$(docker inspect -f '{{.State.ExitCode}}' "$migrate_id")
            if [ "$codigo" = "0" ]; then break; fi
            if [ -n "$codigo" ]; then
              echo "::error::migrate terminó con código $codigo"
              docker compose logs migrate
              exit 1
            fi
            sleep 2
          done
          echo "migrate: exit 0"

          # El historial del healthcheck es lo único que dice por qué falló:
          # `docker compose logs` solo muestra stdout/stderr del proceso, que
          # puede estar perfectamente limpio mientras el probe falla.
          volcado() {
            id="$1"
            [ -n "$id" ] || return 0
            docker inspect -f '{{json .State.Health.Log}}' "$id" \
              | head -c 3000 || true
            echo
          }

          esperar_sano() {
            servicio="$1"
            for _ in $(seq 1 120); do
              id=$(docker compose ps -q "$servicio" || true)
              if [ -n "$id" ]; then
                salud=$(docker inspect -f '{{.State.Health.Status}}' "$id")
                if [ "$salud" = "healthy" ]; then
                  echo "$servicio: healthy"
                  return 0
                fi
                if [ "$salud" = "unhealthy" ]; then
                  echo "::error::$servicio quedó unhealthy"
                  volcado "$id"
                  docker compose logs --tail=100 "$servicio"
                  return 1
                fi
              fi
              sleep 2
            done
            echo "::error::$servicio no llegó a healthy"
            volcado "$id"
            docker compose logs --tail=100 "$servicio"
            return 1
          }

          esperar_sano api
          esperar_sano web

          # El health de la API comprueba la base, no solo que el proceso viva.
          curl -fsS http://127.0.0.1:3000/health | grep -q '"database":"ok"' \
            || { echo "::error::la API responde pero sin base de datos"; exit 1; }

          docker compose ps --format '{{.Name}}	{{.Status}}'

      - name: Logs del stack si algo falló
        if: failure()
        run: docker compose logs --tail=100

      - name: Baja el stack
        if: always()
        run: docker compose down -v