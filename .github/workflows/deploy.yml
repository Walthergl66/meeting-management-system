name: Deploy

# Despliegue manual y opt-in: no se dispara con cada push a main.
#
# 1. Crear el entorno "production" en Settings → Environments.
# 2. Definir la variable ENABLE_DEPLOY=true en ese entorno (no en el repo:
#    mientras no exista, este workflow se salta entero).
# 3. Añadir como secrets del entorno DEPLOY_HOST y DEPLOY_SSH_KEY.
#
# Es un esqueleto deliberadamente conservative: el stack se levanta con
# docker compose tras pasar el SSH. Si falta cualquier precondición el job
# termina sin hacer nada, en lugar de fallar en rojo en cada push.

on:
  workflow_dispatch:
    inputs:
      action:
        description: Acción sobre el servidor
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - restart
          - logs

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Desplegar en producción
    runs-on: ubuntu-latest
    environment: production
    # Sin `secrets` aquí a propósito: el contexto secrets no está disponible en
    # el `if` de un job, y referenciarlo hacía que GitHub rechazara el fichero
    # entero. Eso dejó 27 pushes seguidos en rojo sin ejecutar un solo job. La
    # comprobación del secreto vive ahora en un step.
    if: >-
      vars.ENABLE_DEPLOY == 'true'
      && vars.DEPLOY_HOST != ''
    steps:
      - name: Comprobar precondiciones
        env:
          DEPLOY_APP_DIR: ${{ vars.DEPLOY_APP_DIR }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          ACTION: ${{ inputs.action }}
        run: |
          set -euo pipefail
          echo "Host: $DEPLOY_HOST"
          echo "Acción: $ACTION"
          test -n "$DEPLOY_APP_DIR" \
            || { echo "Falta la variable de entorno DEPLOY_APP_DIR"; exit 1; }
          test -n "$DEPLOY_KNOWN_HOSTS" \
            || { echo "Falta DEPLOY_KNOWN_HOSTS: no se aceptará una clave SSH desconocida"; exit 1; }

      - name: Preparar la clave SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        # La clave llega por env y no interpolada en el cuerpo del run: GitHub
        # sustituye el valor antes de que lo parsee bash, así que una clave con
        # comillas, $(...) o backticks se ejecutaría como código.
        run: |
          set -euo pipefail
          test -n "$DEPLOY_SSH_KEY" \
            || { echo "Falta el secreto DEPLOY_SSH_KEY del entorno"; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Desplegar por SSH
        env:
          DEPLOY_APP_DIR: ${{ vars.DEPLOY_APP_DIR }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          ACTION: ${{ inputs.action }}
        run: |
          set -euo pipefail
          case "$ACTION" in
            deploy)
              # El script remoto va con comillas en el heredoc para que no se
              # expanda en local, y el directorio viaja en la propia línea de
              # comando: ssh no propaga variables de entorno al host remoto, así
              # que dentro del heredoc $DEPLOY_APP_DIR salía sin valor y el
              # `set -u` remoto abortaba el despliegue siempre.
              ssh -i ~/.ssh/deploy_key "root@$DEPLOY_HOST" "cd '$DEPLOY_APP_DIR' && bash -s" <<'REMOTE'
          set -euo pipefail
          # Sin .env no hay despliegue: el compose exige JWT_SECRET, y el fallo
          # se manifestaría como crashloop de la API tras un "up" con éxito.
          test -f .env || { echo "Falta .env de producción en el servidor"; exit 1; }
          # Las migraciones las aplica el servicio `migrate` del propio compose:
          # api depende de él con service_completed_successfully, así que no se
          # ejecutan a mano y no pueden quedar desfasadas.
          docker compose pull
          docker compose up -d --build --remove-orphans
          docker compose ps
          REMOTE
              ;;
            restart)
              ssh -i ~/.ssh/deploy_key "root@$DEPLOY_HOST" \
                "cd '$DEPLOY_APP_DIR' && docker compose restart"
              ;;
            logs)
              ssh -i ~/.ssh/deploy_key "root@$DEPLOY_HOST" \
                "cd '$DEPLOY_APP_DIR' && docker compose logs --tail=200"
              ;;
          esac