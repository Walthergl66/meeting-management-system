services:
  db:
    image: postgres:16-alpine
    container_name: meetflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-meetflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meetflow}
      POSTGRES_DB: ${POSTGRES_DB:-meetflow}
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-meetflow} -d ${POSTGRES_DB:-meetflow}']
      interval: 5s
      timeout: 5s
      retries: 10

  # Servicio de un solo uso: aplica las migraciones y termina. Si falla, la
  # API no arranca. Usa la etapa de build porque el CLI de Prisma es una
  # dependencia de desarrollo.
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: build
    container_name: meetflow-migrate
    restart: 'no'
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql://meetflow:meetflow@db:5432/meetflow?schema=public}
    # El backend es un proyecto pnpm independiente: no hay workspace que
    # resolver, por eso el comando va con la ruta del paquete. La imagen
    # trabaja en /repo/backend (ver WORKDIR en backend/Dockerfile), no en /app.
    command: pnpm --dir /repo/backend exec prisma migrate deploy

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: meetflow-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql://meetflow:meetflow@db:5432/meetflow?schema=public}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3001}
      # Vacío por defecto: el compose expone la API directamente, sin proxy
      # delante. Activar esto sin uno delante haría falseable la IP del cliente.
      TRUST_PROXY: ${TRUST_PROXY:-}
      STORAGE_DRIVER: local
      STORAGE_LOCAL_PATH: /app/uploads
    volumes:
      - api-uploads:/app/uploads
    ports:
      - '3000:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      # Next incrusta la URL de la API en el bundle durante el build, así que
      # tiene que entrar como argumento de construcción, no solo por entorno.
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000}
    container_name: meetflow-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000}
    ports:
      - '3001:3001'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  db-data:
  api-uploads:
